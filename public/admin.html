<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esprit Mode — Boutique</title><style>body{font-family:system-ui;margin:0;background:#f7f5f2;color:#222}header{background:#171717;color:#fff;padding:20px}main{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc;margin:4px}button{background:#171717;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.stat{font-size:28px;font-weight:800}.muted{color:#777}.tabs button{background:#ddd;color:#222}.hidden{display:none}.qr{width:150px;height:150px}</style></head><body><header><strong>ESPRIT MODE</strong> — Espace boutique</header><main><div class="grid"><div class="card"><div>Clientes</div><div id="customers" class="stat">—</div></div><div class="card"><div>Achats</div><div id="sales" class="stat">—</div></div><div class="card"><div>CA enregistré</div><div id="total" class="stat">— €</div></div><div class="card"><div>Points en circulation</div><div id="points" class="stat">—</div></div></div><div class="tabs"><button onclick="show('clients')">Clientes</button><button onclick="show('rewards')">Récompenses</button><button onclick="show('users')">Utilisateurs</button></div><section id="clients"><div class="card"><h2>Rechercher une cliente</h2><input id="q" placeholder="Nom, téléphone, e-mail" oninput="search()"><div id="list"></div></div><div class="card"><h2>Nouvelle cliente</h2><input id="fn" placeholder="Prénom"><input id="ln" placeholder="Nom"><input id="ph" placeholder="Téléphone"><input id="em" placeholder="E-mail"><button onclick="addCustomer()">Créer</button><span id="msg"></span></div><div class="card"><h2>Export</h2><button onclick="location.href='/api/export.csv'">Télécharger le fichier clientes CSV</button></div></section><section id="rewards" class="hidden"><div class="card"><h2>Récompenses</h2><div id="rewardList"></div><h3>Ajouter une récompense</h3><input id="rn" placeholder="Nom, ex. Bon de 10 €"><input id="rp" type="number" placeholder="Points"><input id="rv" type="number" step="0.01" placeholder="Valeur €"><button onclick="addReward()">Ajouter</button></div></section><section id="users" class="hidden"><div class="card"><h2>Créer un accès vendeur</h2><input id="un" placeholder="Identifiant"><input id="up" type="password" placeholder="Mot de passe"><select id="ur"><option value="seller">Vendeuse</option><option value="admin">Administrateur</option></select><button onclick="addUser()">Créer</button><div id="userList"></div></div></section></main><script>const H=()=>({Authorization:localStorage.auth||''});async function api(u,o={}){o.headers={...(o.headers||{}),...H(),'Content-Type':'application/json'};const r=await fetch(u,o);if(r.status===401){location.href='/';throw 0}return r}async function stats(){const r=await api('/api/stats');const d=await r.json();customers.textContent=d.customers;sales.textContent=d.sales;total.textContent=d.total.toFixed(2)+' €';points.textContent=d.points}async function search(){const r=await api('/api/customers?q='+encodeURIComponent(q.value));const d=await r.json();list.innerHTML='<table><tr><th>Cliente</th><th>Téléphone</th><th>Points</th><th>Actions</th></tr>'+d.map(c=>`<tr><td>${c.first_name} ${c.last_name}</td><td>${c.phone}</td><td>${c.points}</td><td><button onclick="purchase(${c.id},'${esc(c.first_name)}')">Achat</button> <button onclick="card(${c.id})">Carte / QR</button> <button onclick="redeem(${c.id})">Récompense</button> <button onclick="delCustomer(${c.id},'${esc(c.first_name+' '+c.last_name)}')">Supprimer</button></td></tr>`).join('')+'</table>'}function esc(s){return String(s).replaceAll("'",'')}async function addCustomer(){const body={first_name:fn.value,last_name:ln.value,phone:ph.value,email:em.value};const r=await api('/api/customers',{method:'POST',body:JSON.stringify(body)});const d=await r.json();msg.textContent=r.ok?' Cliente créée.':' '+d.error;search();stats()}async function delCustomer(id,name){if(!confirm('Supprimer définitivement la cliente '+name+' et son historique d’achats ?'))return;const r=await api('/api/customers/'+id,{method:'DELETE'});const d=await r.json();alert(r.ok?'Cliente supprimée.':d.error);search();stats()}async function purchase(id,name){const amount=prompt('Montant de l’achat de '+name+' (€)');if(!amount)return;const r=await api('/api/purchases',{method:'POST',body:JSON.stringify({customer_id:id,amount})});const d=await r.json();alert(r.ok?`Achat enregistré. Nouveau solde : ${d.points} points`:d.error);search();stats()}async function card(id){const r=await api('/api/customers/'+id+'/history');const h=await r.json();const c=(await (await api('/api/customers?q=')).json()).find(x=>x.id===id);const w=window.open('','_blank');w.document.write(`<h2>Esprit Mode — ${c.first_name} ${c.last_name}</h2><p>${c.points} points</p><p><a href="${location.origin}/carte.html?token=${c.public_token}">${location.origin}/carte.html?token=${c.public_token}</a></p><img src="/api/qr/${id}" style="width:220px"><h3>Historique</h3>${h.map(x=>`<p>${new Date(x.created_at).toLocaleDateString('fr-FR')} — ${Number(x.amount).toFixed(2)} € — +${x.points} pts</p>`).join('')}`)}async function redeem(id){const r=await api('/api/rewards');const rs=await r.json();const choice=prompt(rs.map(x=>`${x.id}: ${x.name} — ${x.points_cost} points`).join('\n')+'\n\nEntrez l’identifiant :');if(!choice)return;const x=await api('/api/redemptions',{method:'POST',body:JSON.stringify({customer_id:id,reward_id:Number(choice)})});const d=await x.json();alert(x.ok?`Récompense utilisée. Solde : ${d.points} points`:d.error);search();stats()}async function rewards(){const r=await api('/api/rewards');const d=await r.json();rewardList.innerHTML=d.map(x=>`<p><b>${x.name}</b> — ${x.points_cost} points — ${Number(x.value_cents/100).toFixed(2)} €</p>`).join('')}async function addReward(){const r=await api('/api/rewards',{method:'POST',body:JSON.stringify({name:rn.value,points_cost:rp.value,value_euros:rv.value})});const d=await r.json();if(!r.ok)alert(d.error);rn.value=rp.value=rv.value='';rewards()}async function users(){const r=await api('/api/users');const d=await r.json();userList.innerHTML='<h3>Accès existants</h3>'+d.map(x=>`<p>${x.username} — ${x.role}</p>`).join('')}async function addUser(){const r=await api('/api/users',{method:'POST',body:JSON.stringify({username:un.value,password:up.value,role:ur.value})});const d=await r.json();if(!r.ok)alert(d.error);else alert('Utilisateur créé');users()}function show(s){for(const id of ['clients','rewards','users'])document.getElementById(id).classList.toggle('hidden',id!==s);if(s==='rewards')rewards();if(s==='users')users()}stats();search()</script></body></html>
