<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><title>Esprit Mode — Back-office</title><style>body{font-family:system-ui;margin:0;background:#f7f5f2;color:#222}header{background:#171717;color:#fff;padding:20px}main{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc;margin:4px}button{background:#171717;color:#fff}.tabs button{background:#ddd;color:#222}.hidden{display:none}.stat{font-size:28px;font-weight:800}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#777}</style></head><body><header><strong>ESPRIT MODE</strong> — 🔐 Back-office Élie</header><main><div class="grid"><div class="card">Clientes<div id="customers" class="stat">—</div></div><div class="card">Achats<div id="sales" class="stat">—</div></div><div class="card">CA<div id="total" class="stat">— €</div></div><div class="card">Points<div id="points" class="stat">—</div></div></div><div class="tabs"><button onclick="show('clients')">Clientes</button><button onclick="show('rewards')">Récompenses</button><button onclick="show('users')">Utilisateurs</button></div><section id="clients"><div class="card"><h2>Clientes</h2><input id="q" placeholder="Nom, téléphone, e-mail" oninput="search()"><div id="list"></div></div><div class="card"><h2>Export</h2><button onclick="location.href='/api/export.csv'">Exporter les clientes CSV</button></div></section><section id="rewards" class="hidden"><div class="card"><h2>Récompenses</h2><div id="rewardList"></div><input id="rn" placeholder="Nom"><input id="rp" type="number" placeholder="Points"><input id="rv" type="number" step="0.01" placeholder="Valeur €"><button onclick="addReward()">Ajouter</button></div></section><section id="users" class="hidden"><div class="card"><h2>Créer un accès</h2><input id="un" placeholder="Identifiant"><input id="up" type="password" placeholder="Mot de passe"><input id="ud" placeholder="Nom affiché"><select id="ur"><option value="manager">Michelle — Gestion commerciale</option><option value="seller">Vendeuse</option><option value="admin">Administrateur</option></select><button onclick="addUser()">Créer</button><div id="userList"></div></div></section></main><script>const H=()=>({Authorization:localStorage.auth||''});async function api(u,o={}){o.headers={...(o.headers||{}),...H(),'Content-Type':'application/json'};const r=await fetch(u,o);if(r.status===401){location.href='/login.html';throw 0}return r}async function stats(){const d=await(await api('/api/stats')).json();customers.textContent=d.customers;sales.textContent=d.sales;total.textContent=d.total.toFixed(2)+' €';points.textContent=d.points}async function search(){const d=await(await api('/api/customers?q='+encodeURIComponent(q.value))).json();list.innerHTML='<table><tr><th>Cliente</th><th>Téléphone</th><th>Points</th><th>Action</th></tr>'+d.map(c=>`<tr><td>${c.first_name} ${c.last_name}</td><td>${c.phone}</td><td>${c.points}</td><td><button onclick="purchase(${c.id},'${c.first_name}')">Achat</button></td></tr>`).join('')+'</table>'}async function purchase(id,name){const amount=prompt('Montant de l’achat de '+name+' (€)');if(!amount)return;const d=await(await api('/api/purchases',{method:'POST',body:JSON.stringify({customer_id:id,amount})})).json();alert(d.error||('Achat enregistré — '+d.points+' points'));search();stats()}async function rewards(){const d=await(await api('/api/rewards')).json();rewardList.innerHTML=d.map(x=>`<p><b>${x.name}</b> — ${x.points_cost} points — ${Number(x.value_cents/100).toFixed(2)} €</p>`).join('')}async function addReward(){const r=await api('/api/rewards',{method:'POST',body:JSON.stringify({name:rn.value,points_cost:rp.value,value_euros:rv.value})});const d=await r.json();if(!r.ok)alert(d.error);else{rn.value=rp.value=rv.value='';rewards()}}async function users(){const d=await(await api('/api/users')).json();userList.innerHTML='<h3>Accès</h3>'+d.map(x=>`<p>${x.display_name} — <b>${x.role}</b> — ${x.username}</p>`).join('')}async function addUser(){const r=await api('/api/users',{method:'POST',body:JSON.stringify({username:un.value,password:up.value,display_name:ud.value,role:ur.value})});const d=await r.json();if(!r.ok)alert(d.error);else{alert('Accès créé');users()}}function show(s){for(const id of ['clients','rewards','users'])document.getElementById(id).classList.toggle('hidden',id!==s);if(s==='rewards')rewards();if(s==='users')users()}stats();search()</script></body></html>
