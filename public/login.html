<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#465157">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="esprit mode"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest-equipe.json">

<link rel="stylesheet" href="style.css"><title>Connexion — esprit mode</title></head>
<body>
<header class="top"><span class="brand">esprit mode<small>équipe</small></span></header>
<main class="narrow">
  <form class="card" id="f" autocomplete="on">
    <h2>Connexion à votre espace</h2>
    <label class="field">Identifiant<input id="u" autocomplete="username" autocapitalize="none" required></label>
    <label class="field">Mot de passe<input id="p" type="password" autocomplete="current-password" required></label>
    <button id="b">Se connecter</button>
    <div id="m"></div>
    <p class="small muted">La connexion reste active 30 jours sur cet appareil. Pensez à vous déconnecter sur un appareil partagé.</p>
  </form>
</main>
<script src="app.js"></script>
<script>
(async () => { if (!getAuth()) return; try { const r = await fetch('/api/me', { headers: { Authorization: getAuth() } }); if (r.ok) { const d = await r.json(); location.replace(d.role === 'admin' ? '/admin.html' : d.role === 'manager' ? '/boutique.html' : '/vente.html'); } } catch (e) {} })();
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('b').disabled = true; $('m').className = ''; $('m').textContent = 'Connexion…';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('u').value, password: $('p').value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Connexion impossible');
    setAuth('Bearer ' + d.token);
    location.href = d.role === 'admin' ? '/admin.html' : d.role === 'manager' ? '/boutique.html' : '/vente.html';
  } catch (err) { $('m').className = 'err'; $('m').textContent = err.message === 'Failed to fetch' ? 'Serveur injoignable, réessayez dans une minute.' : err.message; }
  finally { $('b').disabled = false; }
});
</script>
</body></html>
