<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#465157"><title>Connexion — Esprit Mode</title><style>body{font-family:system-ui;margin:0;background:#f7f3ee;color:#222}main{max-width:420px;margin:12vh auto;padding:18px}.card{background:#fff;padding:24px;border-radius:22px;box-shadow:0 3px 16px #0001}input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid #ccc;margin:7px 0}button{background:linear-gradient(135deg,#465157,#586267 55%,#3e494e);color:#fff}.err{color:#b00020}</style></head><body><main><div class="card"><h1 style="text-transform:lowercase;letter-spacing:.08em">esprit mode</h1><p>Connexion à votre espace</p><input id="u" placeholder="Identifiant" autocomplete="username"><input id="p" type="password" placeholder="Mot de passe" autocomplete="current-password"><button onclick="go()">Se connecter</button><div id="m"></div></div></main><script>async function go(){const u=uEl.value,p=pEl.value;localStorage.auth='Basic '+btoa(u+':'+p);const r=await fetch('/api/me',{headers:{Authorization:localStorage.auth}});if(!r.ok){m.className='err';m.textContent='Identifiants incorrects';return}const d=await r.json();location.href=d.role==='admin'?'/admin.html':d.role==='manager'?'/boutique.html':'/vente.html'}const uEl=document.getElementById('u'),pEl=document.getElementById('p'),m=document.getElementById('m');</script></body></html>
