<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#465157"><link rel="manifest" href="manifest.json"><title>Esprit Mode — Michelle</title><style>body{font-family:system-ui;margin:0;background:#f7f3ee;color:#222}header{background:linear-gradient(135deg,#465157,#586267 55%,#3e494e);color:#fff;padding:20px}main{max-width:850px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 2px 12px #0001}input,textarea,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccc;margin:4px;box-sizing:border-box;width:100%}textarea{min-height:130px}button{background:linear-gradient(135deg,#465157,#586267 55%,#3e494e);color:#fff}.channels{display:grid;grid-template-columns:1fr 1fr;gap:5px}.campaign{border:1px solid #ddd;border-radius:14px;padding:12px;margin:8px 0}.tag{display:inline-block;padding:4px 8px;background:#eee;border-radius:9px;margin:2px}</style></head><body><header><strong>esprit mode</strong> — 👑 Espace Michelle</header><main>
<div class="card"><h2>👤 Recherche cliente</h2><input id="q" placeholder="Nom, téléphone, e-mail" oninput="searchCustomers()"><div id="customersList">Saisissez un nom, téléphone ou e-mail.</div></div>
<div id="profile" class="card" style="display:none"></div>
<div class="card"><h2>📣 Communication</h2><p>Prépare une campagne promotionnelle. L'envoi SMS/e-mail/WhatsApp sera activé lorsque les services d'envoi seront raccordés.</p><input id="title" placeholder="Titre de la promotion"><textarea id="message" placeholder="Votre message..."></textarea><input id="media" placeholder="Lien vers photo ou vidéo (optionnel)"><div class="channels"><label><input type="checkbox" id="email"> E-mail</label><label><input type="checkbox" id="sms"> SMS</label><label><input type="checkbox" id="whatsapp"> WhatsApp</label><label><input type="checkbox" id="facebook"> Facebook</label><label><input type="checkbox" id="instagram"> Instagram</label></div><button onclick="saveCampaign()">Enregistrer la campagne</button><div id="msg"></div></div>
<div class="card"><h2>Campagnes</h2><div id="campaignList">Chargement…</div></div>
</main><script>
const H=()=>({Authorization:localStorage.auth||''});
async function api(u,o={}){o.headers={...(o.headers||{}),...H(),'Content-Type':'application/json'};const r=await fetch(u,o);if(r.status===401){location.href='/login.html';throw 0}return r}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function searchCustomers(){const qv=q.value.trim();if(!qv){customersList.innerHTML='Saisissez un nom, téléphone ou e-mail.';return}const r=await api('/api/customers?q='+encodeURIComponent(qv));const d=await r.json();customersList.innerHTML=d.length?d.map(c=>`<div class="campaign"><b>${esc(c.first_name)} ${esc(c.last_name)}</b><br>📞 ${esc(c.phone)} ${c.email?' · ✉️ '+esc(c.email):''}<br>⭐ <b>${c.points} points</b> <button onclick="openProfile(${c.id})">Voir la fiche</button></div>`).join(''):'<p>Aucune cliente trouvée.</p>'}
async function openProfile(id){const r=await api('/api/customers/'+id+'/profile');const d=await r.json();if(!r.ok){alert(d.error||'Erreur');return}const c=d.customer,s=d.stats;profile.style.display='block';profile.innerHTML=`<h2>👤 ${esc(c.first_name)} ${esc(c.last_name)}</h2><p>📞 ${esc(c.phone)} · ✉️ ${esc(c.email||'—')}</p><p>📅 Cliente depuis ${new Date(c.created_at).toLocaleDateString('fr-FR')} · ${c.birth_date?'🎂 '+esc(c.birth_date):'Date de naissance non renseignée'}</p><p>📧 E-mail : <b>${c.marketing_email?'Oui':'Non'}</b> · 📱 SMS : <b>${c.marketing_sms?'Oui':'Non'}</b></p><div class="campaign"><b>Profil fidélité</b><br>🛍️ ${s.purchases} achats · 💰 ${s.total_euros.toFixed(2)} € dépensés · ⭐ <b>${s.points} points</b><br>${s.last_purchase?'Dernier achat : '+new Date(s.last_purchase).toLocaleString('fr-FR'):'Aucun achat'}</div><h3>🎁 Utiliser une récompense</h3><div id="rewardUse">Chargement…</div><h3>Ajuster la fidélité</h3><input id="delta" type="number" placeholder="Points : +50 ou -20"><input id="reason" placeholder="Motif obligatoire"><button onclick="adjustLoyalty(${c.id})">Enregistrer l'ajustement</button><h3>Historique des achats</h3>${d.purchases.length?'<table><tr><th>Date</th><th>Montant</th><th>Points</th><th>Par</th></tr>'+d.purchases.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('fr-FR')}</td><td>${x.amount.toFixed(2)} €</td><td>+${x.points}</td><td>${esc(x.by_user||'—')}</td></tr>`).join('')+'</table>':'<p>Aucun achat.</p>'}<h3>Récompenses utilisées</h3>${d.redemptions.length?d.redemptions.map(x=>`<p>🎁 ${esc(x.reward_name)} — ${x.points_used} points — ${new Date(x.created_at).toLocaleDateString('fr-FR')} — ${esc(x.by_user||'—')}</p>`).join(''):'<p>Aucune récompense utilisée.</p>'}`;loadRewardsForCustomer(c.id,c.points)}
async function loadRewardsForCustomer(id,points){const r=await api('/api/rewards');const rewards=await r.json();const usable=rewards.filter(x=>x.points_cost<=points);rewardUse.innerHTML=usable.length?usable.map(x=>`<div class="campaign"><b>${esc(x.name)}</b> — ${x.points_cost} points — ${Number(x.value_cents/100).toFixed(2)} € <button onclick="redeem(${id},${x.id})">Utiliser</button></div>`).join(''):'<p>Aucune récompense disponible avec le solde actuel.</p>'}
async function redeem(customerId,rewardId){const r=await api('/api/redemptions',{method:'POST',body:JSON.stringify({customer_id:customerId,reward_id:rewardId})});const d=await r.json();if(!r.ok){alert(d.error||'Impossible d’utiliser la récompense');return}alert('Récompense enregistrée. Nouveau solde : '+d.points+' points');openProfile(customerId)}
async function adjustLoyalty(id){const delta=Number(document.getElementById('delta').value),reason=document.getElementById('reason').value.trim();const r=await api('/api/customers/'+id+'/loyalty',{method:'POST',body:JSON.stringify({delta,reason})});const d=await r.json();if(!r.ok){alert(d.error||'Erreur');return}alert('Fidélité mise à jour : '+d.points+' points');openProfile(id)}
async function loadCampaigns(){const r=await api('/api/campaigns');const d=await r.json();campaignList.innerHTML=d.map(c=>`<div class="campaign"><b>${esc(c.title)}</b><p>${esc(c.message)}</p>${c.media_url?`<p>🎥 ${esc(c.media_url)}</p>`:''}<div>${Object.entries(c.channels).filter(x=>x[1]).map(x=>`<span class="tag">${esc(x[0])}</span>`).join(' ')}</div><small>${esc(c.status)} — ${new Date(c.created_at).toLocaleString('fr-FR')}</small></div>`).join('')||'<p>Aucune campagne.</p>'}
async function saveCampaign(){const body={title:title.value,message:message.value,media_url:media.value,email:email.checked,sms:sms.checked,whatsapp:whatsapp.checked,facebook:facebook.checked,instagram:instagram.checked};const r=await api('/api/campaigns',{method:'POST',body:JSON.stringify(body)});const d=await r.json();msg.textContent=r.ok?'Campagne enregistrée.':'Erreur : '+d.error;if(r.ok){title.value=message.value=media.value='';loadCampaigns()}}
loadCampaigns();
</script></body></html>
