<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><title>Esprit Mode — Michelle</title><style>body{font-family:system-ui;margin:0;background:#f7f5f2;color:#222}header{background:#171717;color:#fff;padding:20px}main{max-width:850px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 2px 12px #0001}input,textarea,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccc;margin:4px;box-sizing:border-box;width:100%}textarea{min-height:130px}button{background:#171717;color:#fff}.channels{display:grid;grid-template-columns:1fr 1fr;gap:5px}.campaign{border:1px solid #ddd;border-radius:14px;padding:12px;margin:8px 0}.tag{display:inline-block;padding:4px 8px;background:#eee;border-radius:9px;margin:2px}</style></head><body><header><strong>ESPRIT MODE</strong> — 👑 Espace Michelle</header><main><div class="card"><h2>Communication</h2><p>Prépare une campagne promotionnelle. L'envoi SMS/e-mail/WhatsApp sera activé lorsque les services d'envoi seront raccordés.</p><input id="title" placeholder="Titre de la promotion"><textarea id="message" placeholder="Votre message..."></textarea><input id="media" placeholder="Lien vers photo ou vidéo (optionnel)"><div class="channels"><label><input type="checkbox" id="email"> E-mail</label><label><input type="checkbox" id="sms"> SMS</label><label><input type="checkbox" id="whatsapp"> WhatsApp</label><label><input type="checkbox" id="facebook"> Facebook</label><label><input type="checkbox" id="instagram"> Instagram</label></div><button onclick="saveCampaign()">Enregistrer la campagne</button><div id="msg"></div></div><div class="card"><h2>Campagnes</h2><div id="list">Chargement…</div></div></main><script>const H=()=>({Authorization:localStorage.auth||''});async function load(){const r=await fetch('/api/campaigns',{headers:H()});if(r.status===401){location.href='/login.html';return}const d=await r.json();list.innerHTML=d.map(c=>`<div class="campaign"><b>${c.title}</b><p>${c.message}</p>${c.media_url?`<p>🎥 ${c.media_url}</p>`:''}<div>${Object.entries(c.channels).filter(x=>x[1]).map(x=>`<span class="tag">${x[0]}</span>`).join(' ')}</div><small>${c.status} — ${new Date(c.created_at).toLocaleString('fr-FR')}</small></div>`).join('')||'<p>Aucune campagne.</p>'}async function saveCampaign(){const body={title:title.value,message:message.value,media_url:media.value,email:email.checked,sms:sms.checked,whatsapp:whatsapp.checked,facebook:facebook.checked,instagram:instagram.checked};const r=await fetch('/api/campaigns',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();msg.textContent=r.ok?'Campagne enregistrée.':'Erreur : '+d.error;if(r.ok){title.value=message.value=media.value='';load()}}load()</script></body></html>
