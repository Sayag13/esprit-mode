<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#465157">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="esprit mode"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="style.css"><title>Ma carte — esprit mode</title>
<style>
.loyalty{background:linear-gradient(135deg,#4a555a 0%,#59656a 46%,#404b50 100%);color:#fff;border-radius:24px;padding:24px 20px;box-shadow:0 14px 34px #29323738;position:relative;overflow:hidden}
.loyalty .b{letter-spacing:.16em;font-size:13px;color:#f0d3c8;text-transform:lowercase}
.loyalty h1{font-family:Georgia,serif;font-weight:500;font-size:26px;margin:14px 0 6px}
.pts{font-size:54px;font-weight:300;line-height:1}
.bar{height:6px;background:#ffffff30;border-radius:3px;margin:14px 0 8px;overflow:hidden}.bar span{display:block;height:100%;background:#e7b9a8}
.next{font-size:15px;color:#fff7f3}
.qrwrap{text-align:center}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.soc a{display:block;text-align:center;text-decoration:none;background:var(--ink);color:#fff;border-radius:12px;padding:12px;font-weight:600}
</style></head>
<body>
<header class="top"><span class="brand">esprit mode<small>ma carte de fidélité</small></span></header>
<main class="narrow" id="app"><div class="card">Chargement…</div></main>
<script src="app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
if (token) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = '/api/public/manifest/' + encodeURIComponent(token); document.head.appendChild(l); try { localStorage.setItem('card_token', token); } catch (e) {} }
let D = null;
async function load() {
  if (!token) { $('app').innerHTML = '<div class="card"><h2>Carte introuvable</h2><p>Ouvrez le lien personnel de votre carte, ou demandez-le en boutique.</p></div>'; return; }
  try { D = await api('/api/public/customer/token/' + encodeURIComponent(token)); }
  catch (e) { $('app').innerHTML = `<div class="card"><h2>${esc(e.message)}</h2><p>Demandez votre lien en boutique.</p></div>`; return; }
  render();
}
function render() {
  const c = D.customer, R = D.rule, left = Math.max(0, R.threshold - c.points), pct = Math.min(100, Math.round(c.points / R.threshold * 100));
  const active = D.vouchers.filter(v => v.status === 'active');
  $('app').innerHTML = `
  ${params.get('bienvenue') && !isStandalone() ? `<div class="card" style="border-color:#cfe1cf"><p class="ok" style="margin:0 0 8px"><b>Bienvenue chez esprit mode !</b> Votre carte est créée.</p>${installBox('Dernière étape : installez votre carte')}</div>` : ''}
  <div class="loyalty"><div class="b">esprit mode</div><h1>${esc(c.first_name)} ${esc(c.last_name)}</h1>
    <div class="pts">${c.points}</div><div>points</div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="next">${left > 0 ? `Encore <b>${left} points</b> pour votre bon d'achat de ${euros0(R.voucher_value)}.` : `Carte pleine : votre bon d'achat de ${euros0(R.voucher_value)} est prêt.`}</div></div>
  ${R.threshold === 300 ? `<div class="card"><h2>Ma carte à tampons</h2>${stampGrid(c.points, 300)}<p class="small muted">Comme la carte papier : 300 € d'achats = un bon d'achat de ${euros0(R.voucher_value)}, valable ${R.validity_days >= 365 ? 'un an' : R.validity_days + ' jours'}.</p></div>` : ''}
  <div class="card"><h2>Mes récompenses</h2>
    ${active.map(v => `<div class="item"><div><div class="name">Bon d'achat de ${euros0(v.value)}</div><div class="small muted">Valable jusqu'au ${fdate(v.expires_at)}</div></div><span class="tag ok">À utiliser en boutique</span></div>`).join('')}
    ${!active.length ? `<p class="muted">Votre prochain bon : ${euros0(R.voucher_value)} à ${R.threshold} points (encore ${left}).</p>` : ''}
    ${D.vouchers.filter(v => v.status !== 'active').map(v => `<div class="item small"><span>Bon de ${euros0(v.value)}</span><span class="muted">${v.status === 'used' ? 'utilisé le ' + fdate(v.used_at) : v.status === 'expired' ? 'expiré le ' + fdate(v.expires_at) : 'annulé'}</span></div>`).join('')}
    ${(D.redemptions || []).map(r => `<div class="item small"><span>Récompense de ${euros0(r.value)}</span><span class="muted">utilisée le ${fdate(r.created_at)}</span></div>`).join('')}
    ${R.conditions ? `<p class="small muted">${esc(R.conditions)}</p>` : ''}</div>
  <div id="content"></div>
  <div class="card qrwrap"><h2>Mon QR code</h2><img class="qr" src="/api/public/qr/${encodeURIComponent(token)}" alt="QR code de ma carte"><p class="small muted">En caisse, donnez votre numéro de téléphone ou montrez ce QR code.</p></div>
  <div class="card"><h2>Mes achats</h2>${D.history.map(x => `<div class="item"><span>${fdate(x.created_at)}</span><span>${money(x.amount)} · +${x.points} pts</span></div>`).join('') || '<p class="muted">Aucun achat enregistré.</p>'}</div>
  <div class="card" id="installCard"><h2>Ma carte sur mon téléphone</h2>${installBox('Installez votre carte esprit mode')}<p class="small muted">Ce lien est personnel : ne le partagez pas.</p></div>
  <form class="card" id="edit" novalidate><h2>Mes coordonnées</h2>
    <div class="row"><input id="efn" value="${esc(c.first_name)}" placeholder="Prénom"><input id="eln" value="${esc(c.last_name)}" placeholder="Nom"></div>
    <input id="eph" type="tel" value="${esc(fmtPhone(c.phone))}" placeholder="Téléphone"><input id="eem" type="email" value="${esc(c.email)}" placeholder="E-mail">
    <label class="field">Date de naissance<input id="ebd" type="date" value="${esc(c.birth_date || '')}"></label>
    <input id="ead" value="${esc(c.address || '')}" placeholder="Adresse"><div class="row"><input id="epc" value="${esc(c.postal_code || '')}" placeholder="Code postal"><input id="eci" value="${esc(c.city || '')}" placeholder="Ville"></div>
    <label class="check"><input id="eme" type="checkbox" ${c.marketing_email ? 'checked' : ''}> <span>Je souhaite recevoir les offres par e-mail</span></label>
    <label class="check"><input id="ems" type="checkbox" ${c.marketing_sms ? 'checked' : ''}> <span>Je souhaite recevoir les offres par SMS</span></label>
    <button id="saveBtn">Enregistrer mes coordonnées</button><div id="saved"></div></form>
  <div class="card"><h2>Mes données</h2>
    ${c.deletion_requested ? '<p class="warn">Votre demande de suppression a été transmise à la boutique.</p>' : `<div id="delZone"><button class="danger" id="delAsk">Demander la suppression de mon compte</button></div>`}
    <p class="small muted"><a href="/conditions.html">Conditions d'utilisation et politique de confidentialité</a></p></div>
  <div class="card"><h2>Partager esprit mode</h2><p>Faites découvrir la carte de fidélité à vos amies.</p><button id="shareBtn">Partager l'application</button><div id="shareMsg" class="small muted"></div></div>
  <div class="card"><h2>Suivez esprit mode</h2><p class="muted">Les nouveautés et les vidéos de Michelle.</p><div class="soc">
    <div style="text-align:center"><img class="qr" style="width:120px;height:120px" src="/api/public/social-qr/instagram" alt="QR code Instagram"><a href="https://www.instagram.com/channel/AbaNU8DS6tgq9Eq6/" target="_blank" rel="noopener">Instagram</a></div>
    <div style="text-align:center"><img class="qr" style="width:120px;height:120px" src="/api/public/social-qr/facebook" alt="QR code Facebook"><a href="https://www.facebook.com/share/v/1Dn4Wx3Ww8/" target="_blank" rel="noopener">Facebook</a></div></div></div>
  <div class="card"><h2>Nos boutiques</h2><p><b>59 avenue du Général de Gaulle</b>, 94700 Maisons-Alfort</p><p><b>47 avenue Georges Clemenceau</b>, 94700 Maisons-Alfort</p><p>☎ Michelle : 06 62 55 24 87</p></div>`;
  $('edit').addEventListener('submit', save);
  const del = $('delAsk'); if (del) del.addEventListener('click', askDelete);
  $('shareBtn').addEventListener('click', () => shareApp($('shareMsg')));
  loadContent();
}
async function save(e) {
  e.preventDefault(); $('saveBtn').disabled = true;
  try {
    await api('/api/public/customer/token/' + encodeURIComponent(token), { method: 'PUT', body: { first_name: $('efn').value, last_name: $('eln').value, phone: $('eph').value, email: $('eem').value,
      birth_date: $('ebd').value, address: $('ead').value, postal_code: $('epc').value, city: $('eci').value, marketing_email: $('eme').checked, marketing_sms: $('ems').checked } });
    $('saved').className = 'ok'; $('saved').textContent = 'Coordonnées mises à jour.';
  } catch (err) { $('saved').className = 'err'; $('saved').textContent = err.message; }
  $('saveBtn').disabled = false;
}
function videoLabel(u) { return /instagram\.com/.test(u) ? 'Regarder sur Instagram' : /facebook\.com|fb\.watch/.test(u) ? 'Regarder sur Facebook' : /youtu/.test(u) ? 'Regarder sur YouTube' : 'Regarder la vidéo'; }
async function loadContent() {
  let c; try { c = await api('/api/public/content'); } catch (e) { return; }
  let h = '';
  if (c.offers.length) h += `<div class="card"><h2>Offres et nouveautés</h2>${c.offers.map(o => `<div class="item" style="display:block"><div class="name">${esc(o.title)}</div><p style="white-space:pre-line;margin:6px 0">${esc(o.message)}</p>${o.media_url ? `<a href="${esc(o.media_url)}" target="_blank" rel="noopener">Voir la photo / la vidéo</a>` : ''}<div class="small muted">${fdate(o.created_at)}</div></div>`).join('')}</div>`;
  if (c.videos.length) h += `<div class="card"><h2>Les vidéos de Michelle</h2>${c.videos.map(v => `<div class="item"><div><div class="name">${esc(v.title)}</div>${v.description ? `<div class="small muted">${esc(v.description)}</div>` : ''}</div><a href="${esc(v.url)}" target="_blank" rel="noopener" style="display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:9px 13px;text-decoration:none;font-size:14px">${videoLabel(v.url)}</a></div>`).join('')}</div>`;
  $('content').innerHTML = h;
}
function askDelete() {
  $('delZone').innerHTML = `<p class="warn">Votre carte, vos points et vos bons seront supprimés. Confirmez-vous ?</p><div class="row"><button class="danger" id="delYes">Oui, supprimer mon compte</button><button class="secondary" id="delNo">Annuler</button></div>`;
  $('delNo').addEventListener('click', render);
  $('delYes').addEventListener('click', async () => { try { await api('/api/public/customer/token/' + encodeURIComponent(token) + '/delete-request', { method: 'POST' }); await load(); } catch (e) { toast(e.message, true); } });
}
load();
</script>
</body></html>
