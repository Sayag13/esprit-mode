<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Ma carte — Esprit Mode</title><style>:root{--ink:#171717;--cream:#f7f4ef;--gold:#c8a96b;--muted:#706b64;--line:#e7e1d8}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--cream);color:#222}header{background:var(--ink);color:#fff;padding:18px;text-align:center;letter-spacing:.08em}header strong{font-size:18px}header div{font-size:11px;color:#d8d1c6;letter-spacing:.18em;text-transform:uppercase;margin-top:3px}main{max-width:620px;margin:auto;padding:16px 14px 38px}.loyalty{background:linear-gradient(135deg,#171717,#2b2926);color:#fff;border-radius:26px;padding:26px 22px;box-shadow:0 10px 28px #0002;position:relative;overflow:hidden}.brand{letter-spacing:.14em;font-size:12px;color:#e2d6c2}.loyalty h1{font-family:Georgia,serif;font-size:29px;margin:22px 0 7px}.points{font-size:55px;font-weight:800;line-height:1}.points-label{color:#ddd}.next{margin-top:18px;padding:11px 12px;border:1px solid #c8a96b66;border-radius:13px;color:#f2e7d5}.qr{display:block;width:130px;height:130px;background:#fff;padding:7px;border-radius:12px;margin:18px auto 0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 22px #0000000b}.card h2{font-family:Georgia,serif;margin:0 0 10px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.muted{color:var(--muted)}.edit input,.edit button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccc;margin:4px 0;width:100%;box-sizing:border-box}.edit button{background:var(--ink);color:#fff}.consent label{display:block;font-size:13px;margin:8px 0}.consent input{width:auto}.address{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin-top:20px}</style></head><body><header><strong>ESPRIT MODE</strong><div>Ma carte de fidélité</div></header><main id="app"><div class="card">Chargement…</div></main><script>const token=new URLSearchParams(location.search).get('token');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){if(!token){app.innerHTML='<div class="card"><h2>Carte introuvable</h2></div>';return}const r=await fetch('/api/public/customer/token/'+encodeURIComponent(token));const d=await r.json();if(!r.ok){app.innerHTML='<div class="card"><h2>'+esc(d.error)+'</h2></div>';return}const next=d.rewards.filter(x=>x.points_cost>d.customer.points).sort((a,b)=>a.points_cost-b.points_cost)[0];app.innerHTML=`<div class="loyalty"><div class="brand">ESPRIT MODE</div><h1>${esc(d.customer.first_name)} ${esc(d.customer.last_name)}</h1><div class="points">${d.customer.points}</div><div class="points-label">points disponibles</div>${next?`<div class="next">Encore <b>${next.points_cost-d.customer.points} points</b> pour ${esc(next.name)}</div>`:'<div class="next">Vous avez atteint toutes les récompenses disponibles.</div>'}<img class="qr" src="/api/public/qr/${encodeURIComponent(token)}" alt="QR code personnel"></div><div class="card"><h2>Mes récompenses</h2>${d.rewards.map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${x.points_cost} points</b></div>`).join('')||'<p class="muted">Aucune récompense actuellement.</p>'}</div><div class="card"><h2>Mes achats</h2>${d.history.map(x=>`<div class="row"><span>${new Date(x.created_at).toLocaleDateString('fr-FR')}</span><span>${Number(x.amount).toFixed(2)} € · +${x.points} pts</span></div>`).join('')||'<p class="muted">Aucun achat enregistré.</p>'}</div><div class="card edit"><h2>Mes coordonnées</h2><input id="efn" value="${esc(d.customer.first_name)}" placeholder="Prénom"><input id="eln" value="${esc(d.customer.last_name)}" placeholder="Nom"><input id="eph" value="${esc(d.customer.phone)}" placeholder="Téléphone"><input id="eem" value="${esc(d.customer.email)}" placeholder="E-mail"><input id="ebd" type="date" value="${esc(d.customer.birth_date||'')}"><input id="ead" value="${esc(d.customer.address||'')}" placeholder="Adresse"><input id="epc" value="${esc(d.customer.postal_code||'')}" placeholder="Code postal"><input id="eci" value="${esc(d.customer.city||'')}" placeholder="Ville"><div class="consent"><label><input id="eme" type="checkbox" ${d.customer.marketing_email?'checked':''}> Offres par e-mail</label><label><input id="ems" type="checkbox" ${d.customer.marketing_sms?'checked':''}> Offres par SMS</label></div><button onclick="save()">Enregistrer mes coordonnées</button><div id="saved"></div></div><div class="address"><strong>ESPRIT MODE</strong><br>47 avenue Georges Clémenceau · 94700 Maisons-Alfort<br>01 53 88 20 33</div>`}async function save(){const r=await fetch('/api/public/customer/token/'+encodeURIComponent(token),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({first_name:efn.value,last_name:eln.value,phone:eph.value,email:eem.value,birth_date:ebd.value,address:ead.value,postal_code:epc.value,city:eci.value,marketing_email:eme.checked,marketing_sms:ems.checked})});const d=await r.json();saved.textContent=r.ok?'Coordonnées mises à jour.':(d.error||'Erreur');}load()</script></body></html>
