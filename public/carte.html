<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#465157"><title>Ma carte — Esprit Mode</title><style>:root{--anth:#4b565b;--anth2:#3e494e;--anth3:#667177;--cream:#f7f3ee;--paper:#fffdf9;--rose:#e7b9a8;--rose2:#dba18d;--text:#202529;--muted:#697177;--line:#e7ded6}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:linear-gradient(180deg,#f3eee8 0%,#faf8f5 55%,#f2ede7 100%);color:var(--text)}header{background:linear-gradient(135deg,#465157,#586267 55%,#3e494e);color:#fff;padding:18px;text-align:center;box-shadow:0 3px 18px #26313633;letter-spacing:.04em}header strong{font-size:27px;font-weight:500;letter-spacing:.08em;text-transform:lowercase;color:#fff;text-shadow:0 2px 7px #0005}header div{font-size:10px;color:#f3ddd4;letter-spacing:.22em;text-transform:uppercase;margin-top:2px}main{max-width:620px;margin:auto;padding:16px 14px 38px}.loyalty{background:linear-gradient(135deg,#4a555a 0%,#59656a 46%,#404b50 100%);color:#fff;border:1px solid #a9b1b4aa;border-radius:26px;padding:25px 22px;box-shadow:0 14px 34px #29323738, inset 0 1px 0 #ffffff30;position:relative;overflow:hidden}.loyalty:after{content:"";position:absolute;width:260px;height:260px;right:-100px;top:-90px;border-radius:50%;background:linear-gradient(135deg,#ffffff22,#e7b9a800 65%);pointer-events:none}.brand{letter-spacing:.16em;font-size:12px;color:#f0d3c8;text-transform:lowercase}.loyalty h1{font-family:Georgia,serif;font-size:30px;margin:20px 0 7px;position:relative;z-index:1}.points{font-size:55px;font-weight:800;line-height:1;color:#fff}.points-label{color:#f0f2f2}.next{margin-top:18px;padding:13px 14px;border:1px solid #e7b9a899;border-radius:14px;color:#fff7f3;background:#26313722}.qr{display:block;width:130px;height:130px;background:#fff;padding:7px;border-radius:13px;margin:18px auto 0;position:relative;z-index:1;box-shadow:0 7px 18px #1e272b40}.card{background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 7px 24px #34302b10}.card h2{font-family:Georgia,serif;margin:0 0 10px;color:#2a2e31}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.muted{color:var(--muted)}.edit input,.edit button{font:inherit;padding:11px;border-radius:10px;border:1px solid #d4ccc4;margin:4px 0;width:100%;box-sizing:border-box}.edit input:focus{outline:2px solid #e7b9a866;border-color:var(--rose2)}.edit button{background:var(--anth2);color:#fff;border:0}.consent label{display:block;font-size:13px;margin:8px 0}.consent input{width:auto}.address{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin-top:20px}.address strong{color:var(--anth2);text-transform:lowercase;letter-spacing:.12em}@media(max-width:520px){main{padding:12px 12px 30px}.loyalty{padding:22px 18px}.loyalty h1{font-size:28px}.points{font-size:52px}}.install button{width:100%;padding:12px;border:0;border-radius:11px;background:var(--anth2);color:#fff;font:inherit}.social-note{padding:12px;border-radius:12px;background:#f4eee8;color:var(--muted);font-size:13px}
</style></head><body><header><strong>esprit mode</strong><div>ma carte de fidélité</div></header><main id="app"><div class="card">Chargement…</div></main><script>const token=new URLSearchParams(location.search).get('token');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){if(!token){app.innerHTML='<div class="card"><h2>Carte introuvable</h2></div>';return}const r=await fetch('/api/public/customer/token/'+encodeURIComponent(token));const d=await r.json();if(!r.ok){app.innerHTML='<div class="card"><h2>'+esc(d.error)+'</h2></div>';return}const next=d.rewards.filter(x=>x.points_cost>d.customer.points).sort((a,b)=>a.points_cost-b.points_cost)[0];app.innerHTML=`<div class="loyalty"><div class="brand">esprit mode</div><h1>${esc(d.customer.first_name)} ${esc(d.customer.last_name)}</h1><div class="points">${d.customer.points}</div><div class="points-label">points disponibles</div>${next?`<div class="next">Encore <b>${next.points_cost-d.customer.points} points</b> pour ${esc(next.name)}</div>`:'<div class="next">Vous avez atteint toutes les récompenses disponibles.</div>'}<img class="qr" src="/api/public/qr/${encodeURIComponent(token)}" alt="QR code personnel"></div><div class="card"><h2>Mes récompenses</h2>${d.rewards.map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${x.points_cost} points</b></div>`).join('')||'<p class="muted">Aucune récompense actuellement.</p>'}</div><div class="card"><h2>Mes achats</h2>${d.history.map(x=>`<div class="row"><span>${new Date(x.created_at).toLocaleDateString('fr-FR')}</span><span>${Number(x.amount).toFixed(2)} € · +${x.points} pts</span></div>`).join('')||'<p class="muted">Aucun achat enregistré.</p>'}</div><div class="card edit"><h2>Mes coordonnées</h2><input id="efn" value="${esc(d.customer.first_name)}" placeholder="Prénom"><input id="eln" value="${esc(d.customer.last_name)}" placeholder="Nom"><input id="eph" value="${esc(d.customer.phone)}" placeholder="Téléphone"><input id="eem" value="${esc(d.customer.email)}" placeholder="E-mail"><input id="ebd" type="date" value="${esc(d.customer.birth_date||'')}"><input id="ead" value="${esc(d.customer.address||'')}" placeholder="Adresse"><input id="epc" value="${esc(d.customer.postal_code||'')}" placeholder="Code postal"><input id="eci" value="${esc(d.customer.city||'')}" placeholder="Ville"><div class="consent"><label><input id="eme" type="checkbox" ${d.customer.marketing_email?'checked':''}> Offres par e-mail</label><label><input id="ems" type="checkbox" ${d.customer.marketing_sms?'checked':''}> Offres par SMS</label></div><button onclick="save()">Enregistrer mes coordonnées</button><div id="saved"></div></div><div class="card install"><h2>📲 Mon application Esprit Mode</h2><p>Ajoutez Esprit Mode à votre écran d'accueil pour retrouver votre carte rapidement.</p><button onclick="shareApp()">Partager ma carte</button><div id="installMsg" class="muted"></div></div>
<div class="card social"><h2>Suivez Esprit Mode</h2><p>Retrouvez les nouveautés et les vidéos de Michelle.</p><div class="social-note">Instagram et Facebook seront disponibles ici dès que leurs liens officiels seront intégrés.</div></div>
<div class="card"><h2>Nos boutiques</h2><div class="row"><span>47 avenue Georges Clemenceau<br>94700 Maisons-Alfort</span><span>☎ 06 62 55 24 87</span></div><div class="row"><span>59 avenue du Général de Gaulle<br>94700 Maisons-Alfort</span><span>☎ 06 62 55 24 87</span></div></div>`}async function shareApp(){const url=location.href;if(navigator.share){try{await navigator.share({title:'Ma carte Esprit Mode',text:'Ma carte de fidélité Esprit Mode',url})}catch(e){}}else{try{await navigator.clipboard.writeText(url);installMsg.textContent='Lien copié.'}catch(e){installMsg.textContent=url}}}
async function save(){const r=await fetch('/api/public/customer/token/'+encodeURIComponent(token),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({first_name:efn.value,last_name:eln.value,phone:eph.value,email:eem.value,birth_date:ebd.value,address:ead.value,postal_code:epc.value,city:eci.value,marketing_email:eme.checked,marketing_sms:ems.checked})});const d=await r.json();saved.textContent=r.ok?'Coordonnées mises à jour.':(d.error||'Erreur');}load()</script></body></html>
