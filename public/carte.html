<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Esprit Mode">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Ma carte — Esprit Mode</title>
<style>
:root{--ink:#171717;--paper:#f7f5f2;--line:#e8e4df}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--paper);color:#222}header{background:var(--ink);color:#fff;padding:22px 20px;padding-top:calc(22px + env(safe-area-inset-top));text-align:center}header strong{font-size:24px;letter-spacing:.08em}header div{opacity:.8;margin-top:3px}main{max-width:560px;margin:auto;padding:16px}.loyalty{background:linear-gradient(145deg,#171717,#363636);color:#fff;border-radius:26px;padding:24px;box-shadow:0 10px 30px #0003;position:relative;overflow:hidden}.loyalty:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #fff2;border-radius:50%;right:-65px;top:-65px}.brand{font-size:13px;letter-spacing:.18em;font-weight:700;opacity:.8}.name{font-size:26px;margin:18px 0 8px}.points{font-size:54px;line-height:1;font-weight:800}.label{opacity:.75;margin-top:5px}.qrbox{margin:18px auto 0;background:#fff;border-radius:18px;padding:12px;width:176px;text-align:center}.qrbox img{display:block;width:152px;height:152px;margin:auto}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 4px 20px #0000000d}.card h2{margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.muted{color:#777}.install{width:100%;padding:13px;border:0;border-radius:13px;background:var(--ink);color:#fff;font-weight:700;font-size:16px}.ios{display:none;margin-top:10px;padding:12px;border-radius:12px;background:#f0ede9;font-size:14px}.back{display:block;text-align:center;color:#222;text-decoration:none;padding:10px}.small{font-size:13px;color:#777}
</style>
</head>
<body>
<header><strong>ESPRIT MODE</strong><div>Ma carte de fidélité</div></header>
<main id="app"><div class="card">Chargement…</div></main>
<script>
const token=new URLSearchParams(location.search).get('token');
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('install');if(b)b.style.display='block'});
async function install(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install').style.display='none';}}
function registerSW(){if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function load(){
 registerSW();
 if(!token){app.innerHTML='<div class="card"><h2>Carte introuvable</h2><p class="muted">Le lien de carte est incomplet.</p></div>';return}
 const r=await fetch('/api/public/customer/token/'+encodeURIComponent(token));
 const d=await r.json();
 if(!r.ok){app.innerHTML='<div class="card"><h2>Carte introuvable</h2><p class="muted">'+esc(d.error)+'</p></div>';return}
 const c=d.customer;
 app.innerHTML=`
 <section class="loyalty">
   <div class="brand">ESPRIT MODE</div>
   <div class="name">${esc(c.first_name)} ${esc(c.last_name)}</div>
   <div class="points">${c.points}</div><div class="label">points disponibles</div>
   <div class="qrbox"><img src="/api/public/qr/${encodeURIComponent(c.public_token)}" alt="QR code de la carte"></div>
 </section>
 <div class="card"><button id="install" class="install" style="display:none" onclick="install()">＋ Installer Esprit Mode sur mon téléphone</button><div id="ios" class="ios">Sur iPhone : ouvrez cette page dans Safari, touchez <b>Partager</b>, puis <b>Ajouter à l’écran d’accueil</b>.</div></div>
 <div class="card"><h2>Mes récompenses</h2>${d.rewards.map(x=>`<div class="row"><span>${esc(x.name)}</span><b>${x.points_cost} pts</b></div>`).join('')||'<p class="muted">Aucune récompense actuellement.</p>'}</div>
 <div class="card"><h2>Mes achats</h2>${d.history.map(x=>`<div class="row"><span>${new Date(x.created_at).toLocaleDateString('fr-FR')}</span><span>${Number(x.amount).toFixed(2)} € · +${x.points} pts</span></div>`).join('')||'<p class="muted">Aucun achat enregistré.</p>'}</div>
 <div class="card"><p class="small">Cette carte est personnelle. Présentez votre QR code en boutique pour enregistrer un achat.</p></div>`;
 if(/iPhone|iPad|iPod/i.test(navigator.userAgent) && !window.navigator.standalone){document.getElementById('ios').style.display='block';}
}
load();
</script>
</body></html>
