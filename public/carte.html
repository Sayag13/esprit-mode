<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Ma carte — Esprit Mode</title><style>body{font-family:system-ui;margin:0;background:#f7f5f2;color:#222}header{background:#171717;color:#fff;padding:22px}main{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 4px 20px #0001}.loyalty{background:#171717;color:white;border-radius:24px;padding:25px}.points{font-size:48px;font-weight:800}.muted{color:#777}input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #ccc;margin:4px}button{background:#171717;color:white}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}</style></head><body><header><strong>ESPRIT MODE</strong><div>Ma carte de fidélité</div></header><main id="app"><div class="card">Chargement…</div></main><script>const token=new URLSearchParams(location.search).get('token');async function load(){if(!token){app.innerHTML='<div class="card"><h2>Carte introuvable</h2></div>';return}const r=await fetch('/api/public/customer/token/'+encodeURIComponent(token));const d=await r.json();if(!r.ok){app.innerHTML='<div class="card"><h2>'+d.error+'</h2></div>';return}app.innerHTML=`<div class="loyalty"><div>ESPRIT MODE</div><h1>${d.customer.first_name} ${d.customer.last_name}</h1><div class="points">${d.customer.points}</div><div>points disponibles</div></div><div class="card"><h2>Mes récompenses</h2>${d.rewards.map(x=>`<div class="row"><span>${x.name}</span><b>${x.points_cost} points</b></div>`).join('')||'<p class="muted">Aucune récompense actuellement.</p>'}</div><div class="card"><h2>Mes achats</h2>${d.history.map(x=>`<div class="row"><span>${new Date(x.created_at).toLocaleDateString('fr-FR')}</span><span>${Number(x.amount).toFixed(2)} € · +${x.points} pts</span></div>`).join('')||'<p class="muted">Aucun achat enregistré.</p>'}</div><div class="card"><p class="muted">Conservez cette page dans vos favoris ou ajoutez-la à l'écran d'accueil de votre téléphone.</p></div>`}load()</script></body></html>
