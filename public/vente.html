<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><title>Esprit Mode — Vente</title><style>body{font-family:system-ui;margin:0;background:#f7f5f2;color:#222}header{background:#171717;color:#fff;padding:20px}main{max-width:700px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 2px 12px #0001}input,button{font:inherit;padding:13px;border-radius:12px;border:1px solid #ccc;margin:4px}input{width:calc(100% - 8px);box-sizing:border-box}button{background:#171717;color:#fff}.client{padding:14px;border:1px solid #ddd;border-radius:14px;margin:8px 0}.small{color:#777}</style></head><body><header><strong>ESPRIT MODE</strong> — 🛍️ Vente</header><main><div class="card"><h2>Ajouter un achat</h2><input id="q" placeholder="Rechercher nom ou téléphone" oninput="find()"><div id="results"></div></div><div class="card"><h2>Nouvelle cliente</h2><p class="small">Créer rapidement une carte avec les informations essentielles. Les autres informations pourront être complétées plus tard.</p><input id="nf" placeholder="Prénom"><input id="nl" placeholder="Nom"><input id="np" placeholder="Téléphone"><input id="ne" type="email" placeholder="E-mail"><button onclick="createClient()">Créer la carte</button><div id="msg" class="small"></div></div></main><script>const H=()=>({Authorization:localStorage.auth||''});async function find(){const d=await(await fetch('/api/customers?q='+encodeURIComponent(q.value),{headers:H()})).json();results.innerHTML=d.map(c=>`<div class="client"><b>${c.first_name} ${c.last_name}</b><div class="small">${c.phone} · ${c.points} points</div><button onclick="buy(${c.id},'${c.first_name}')">Enregistrer un achat</button></div>`).join('')}async function createClient(){const first_name=nf.value.trim(),last_name=nl.value.trim(),phone=np.value.trim(),email=ne.value.trim();if(!first_name||!last_name||!phone||!email){msg.textContent='Prénom, nom, téléphone et e-mail sont obligatoires.';return}const r=await fetch('/api/customers',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({first_name,last_name,phone,email})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Impossible de créer la carte.';return}msg.textContent='Carte créée pour '+d.first_name+' '+d.last_name+'.';nf.value='';nl.value='';np.value='';ne.value='';q.value=d.phone;find()}async function buy(id,name){const amount=prompt('Montant de l’achat de '+name+' (€)');if(!amount)return;const r=await fetch('/api/purchases',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({customer_id:id,amount})});const d=await r.json();alert(r.ok?'Achat enregistré. Nouveau solde : '+d.points+' points':d.error);find()}find()</script></body></html>
