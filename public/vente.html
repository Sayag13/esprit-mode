<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#465157">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="esprit mode"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest-equipe.json">

<link rel="stylesheet" href="style.css"><title>Caisse — esprit mode</title></head>
<body>
<header class="top"><span class="brand">esprit mode<small>caisse</small></span><nav id="nav"></nav></header>
<main class="narrow">
  <div class="card" id="searchCard">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Rechercher une cliente</h2>
      <select id="store" class="auto" style="width:auto" aria-label="Boutique"><option value="">Boutique…</option><option>Général de Gaulle</option><option>Clemenceau</option></select></div>
    <div class="row"><input id="q" type="search" placeholder="Téléphone, nom ou e-mail" autocomplete="off" autofocus><button type="button" class="small secondary auto" id="scanBtn">Scanner la carte</button></div>
    <div id="scanBox" class="hidden" style="margin-top:8px"><video id="scanVideo" playsinline muted style="width:100%;border-radius:12px;background:#000"></video>
      <p class="small muted">Visez le QR code de la carte de la cliente (sur son téléphone).</p><button type="button" class="small secondary" id="scanStop">Fermer la caméra</button></div>
    <div id="hint" class="small muted">Tapez les premiers chiffres du téléphone ou le nom.</div>
    <div id="results"></div>
    <button class="secondary" id="newBtn" style="margin-top:10px">+ Nouvelle cliente</button>
  </div>

  <div class="card hidden" id="clientCard"></div>

  <form class="card hidden" id="newCard" novalidate>
    <h2>Nouvelle cliente</h2>
    <div class="row"><input id="nf" placeholder="Prénom *"><input id="nl" placeholder="Nom *"></div>
    <input id="np" type="tel" inputmode="tel" placeholder="Téléphone *"><input id="ne" type="email" placeholder="E-mail *">
    <label class="field">Date de naissance (facultatif, pour son anniversaire)<input id="nb" type="date"></label>
    <div id="dupWarn"></div>
    <label class="check"><input id="nt" type="checkbox"> <span>La cliente accepte les conditions et la politique de confidentialité * — <a href="/conditions.html" target="_blank" rel="noopener">les lui montrer</a></span></label>
    <label class="check"><input id="nme" type="checkbox"> <span>La cliente souhaite recevoir les offres par e-mail</span></label>
    <label class="check"><input id="nms" type="checkbox"> <span>La cliente souhaite recevoir les offres par SMS</span></label>
    <p class="small muted">Ne cochez les offres que si la cliente l'a demandé.</p>
    <div class="row"><button id="createBtn">Créer la carte</button><button type="button" class="secondary" id="cancelNew">Annuler</button></div>
    <div id="msg"></div>
  </form>
</main>
<script src="app.js"></script>
<script>
const PREVPTS = {}; // points déjà affichés, pour animer les nouveaux tampons après un achat
let SET = null, CUR = null, timer = null, lastList = [], OPT = {}, ME = null;
try { $('store').value = localStorage.getItem('store') || ''; } catch (e) {}
$('store').addEventListener('change', () => { try { localStorage.setItem('store', $('store').value); } catch (e) {} toast($('store').value ? 'Boutique : ' + $('store').value : 'Boutique non précisée'); });
(async () => { ME = await staffNav('vente'); if (!ME) return; try { SET = await api('/api/settings'); OPT = await api('/api/options'); } catch (e) { toast(e.message, true); } })();

$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(find, 200); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (lastList.length === 1) openClient(lastList[0].id); } });
async function find() {
  const term = $('q').value.trim(); $('results').innerHTML = '';
  if (!term) { $('hint').textContent = 'Tapez les premiers chiffres du téléphone ou le nom.'; lastList = []; return; }
  $('hint').textContent = 'Recherche…';
  try {
    lastList = await api('/api/customers?q=' + encodeURIComponent(term));
    const digits = term.replace(/\D/g, ''), low = term.toLowerCase();
    const exact = lastList.filter(c => (digits.length >= 10 && c.phone === digits) || (c.email && c.email === low) || `${c.first_name} ${c.last_name}`.toLowerCase() === low);
    if (exact.length) lastList = exact;
    $('hint').textContent = lastList.length ? (lastList.length === 1 ? '1 cliente' : lastList.length + ' clientes') : 'Aucune cliente trouvée.';
    $('results').innerHTML = lastList.map(c => `<div class="item"><div><div class="name">${esc(c.first_name)} ${esc(c.last_name)}</div>
      <div class="small muted">${esc(fmtPhone(c.phone))} · <b>${c.points} points</b>${c.vouchers ? ' · <span class="tag ok">bon à utiliser</span>' : ''}${c.deletion_requested ? ' <span class="tag bad">suppression demandée</span>' : ''}</div></div>
      <button class="small" data-open="${c.id}">Choisir</button></div>`).join('');
  } catch (e) { $('hint').textContent = e.message; }
}
$('results').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openClient(Number(b.dataset.open)); });

async function openClient(id, justCreated) {
  try { CUR = await api('/api/customers/' + id + '/profile'); } catch (e) { toast(e.message, true); return; }
  CUR.justCreated = !!justCreated; $('newCard').classList.add('hidden'); showClient();
}
function preview() {
  const paid = Number(String($('amount')?.value || '').replace(',', '.')) || 0;
  if ($('allExcl')?.checked) $('excl').value = $('amount').value;
  const ex = Math.min(paid, Number(String($('excl')?.value || '').replace(',', '.')) || 0), a = paid - ex;
  const mult = OPT.special_day_enabled ? Number(OPT.special_day_multiplier) || 1 : 1;
  const pts = a > 0 ? Math.floor(a * SET.points_per_euro * mult) : 0, tot = CUR.customer.points + pts;
  $('prev').innerHTML = `<div class="kpi"><b>+${pts}</b><span>points gagnés</span></div><div class="kpi"><b>${tot >= SET.threshold && SET.auto_voucher ? tot % SET.threshold : tot}</b><span>nouveau solde</span></div>` +
    (tot >= SET.threshold && SET.auto_voucher ? `<div class="kpi"><b>${euros0(SET.voucher_value * Math.floor(tot / SET.threshold))}</b><span>bon créé : carte pleine</span></div>` : '');
}
function showClient() {
  const c = CUR.customer, act = CUR.vouchers.filter(v => v.status === 'active');
  $('clientCard').classList.remove('hidden');
  const _prev = PREVPTS[c.id]; setTimeout(() => { PREVPTS[c.id] = c.points; }, 0);
  $('clientCard').innerHTML = `
    ${CUR.justCreated ? `<div class="ok" style="margin-bottom:12px"><b>Carte créée !</b> Envoyez-lui maintenant son lien : elle l'ouvrira d'un geste sur son téléphone${c.email ? ' (elle le reçoit aussi par e-mail)' : ''}.${cardLinkButtons(c, CUR.card_url)}</div>` : ''}
    <div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(c.first_name)} ${esc(c.last_name)}</h2><div class="muted small">${esc(fmtPhone(c.phone))} · ${c.points} points · encore ${CUR.stats.remaining} pour le bon</div></div>
      <button type="button" class="small secondary auto" id="closeClient">Changer</button></div>
    ${c.deletion_requested_at ? '<p class="warn">Cette cliente a demandé la suppression de son compte.</p>' : ''}
    ${CUR.level ? `<p class="small"><span class="tag">Niveau ${esc(CUR.level.name)}</span>${CUR.level.next ? ` encore ${CUR.level.next.remaining} € pour ${esc(CUR.level.next.name)}` : ''}</p>` : ''}
    ${OPT.special_day_enabled ? `<p class="ok small">${esc(OPT.special_day_label)} : points × ${OPT.special_day_multiplier}</p>` : ''}
    ${birthdayBox(CUR)}
    ${$('store').value ? '' : '<p class="warn small">Choisissez la boutique en haut (Général de Gaulle ou Clemenceau) : elle est notée sur chaque achat et retenue sur cet appareil.</p>'}
    <form id="buy" novalidate>
      <label class="field">Montant payé (€)<input id="amount" class="big-amount" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
      <label class="field">Dont articles soldés ou en promotion (€) — sans points<input id="excl" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
      <label class="check"><input type="checkbox" id="allExcl"> <span>Tout l'achat est soldé ou en promotion (aucun point)</span></label>
      ${act.length ? '<p class="field">Bons d\'achat disponibles</p>' + act.map(v => `<label class="check"><input type="checkbox" data-v="${v.id}"> <span>Utiliser le bon de ${euros0(v.value)} (jusqu'au ${fdate(v.expires_at)})</span></label>`).join('') : ''}
      <div class="grid" id="prev"></div>
      <button id="buyBtn" style="margin-top:10px">Valider l'achat</button><div id="buyMsg"></div>
    </form>
    ${stampGrid(c.points, SET ? SET.threshold : 300, _prev)}
    <details><summary class="small"><b>Reprendre une carte papier</b></summary>
      <p class="small muted">Saisissez le total tamponné sur sa carte papier (en euros).</p>
      <div class="row"><input id="paperAmt" inputmode="numeric" placeholder="ex. 180"><button type="button" class="small auto" id="paperBtn">Ajouter les points</button></div></details>
    <details><summary class="small"><b>Donner le lien de sa carte</b></summary>
      <p class="small muted">Envoyez-lui le lien sur son téléphone (conseillé sur iPhone : il s'ouvrira dans Safari), ou faites-lui scanner ce QR code.</p>
      ${cardLinkButtons(c, CUR.card_url)}
      <img class="qr" alt="QR code de la carte" src="/api/public/qr/${encodeURIComponent(CUR.card_url.split('token=')[1] || '')}"></details>`;
  $('amount').addEventListener('input', preview); $('excl').addEventListener('input', () => { $('allExcl').checked = false; preview(); }); $('allExcl').addEventListener('change', () => { if (!$('allExcl').checked) $('excl').value = ''; preview(); }); preview(); $('amount').focus();
  $('buy').addEventListener('submit', buy);
  $('closeClient').addEventListener('click', () => { $('clientCard').classList.add('hidden'); CUR = null; $('q').focus(); });
  $('paperBtn').addEventListener('click', paper);
}
function birthdayBox(P) {
  const b = P.birthday; if (!b || b.in_days === null || b.in_days === undefined) return '';
  const when = b.in_days === 0 ? "aujourd'hui" : b.in_days === 1 ? 'demain' : `dans ${b.in_days} jours`;
  const can = ME && (ME.role !== 'seller' || OPT.birthday_sellers_can_offer);
  if (b.given_this_year) return `<p class="ok small">🎂 Anniversaire ${when} — bonus déjà offert cette année.</p>`;
  return `<div class="warn small" style="margin:8px 0">🎂 <b>Anniversaire ${when} !</b>${can ? `<div class="row" style="margin-top:6px"><input id="bdPts" type="number" min="1" max="1000" value="${Number(OPT.birthday_suggested_points) || 20}" style="max-width:110px"><button type="button" class="small auto" id="bdBtn">Offrir ces points</button></div>` : ' Prévenez Michelle pour le bonus.'}</div>`;
}
document.addEventListener('click', async e => {
  if (!e.target.closest('#bdBtn') || !CUR) return;
  try { const r = await api('/api/customers/' + CUR.customer.id + '/birthday-bonus', { method: 'POST', body: { points: $('bdPts').value } });
    toast('Bonus anniversaire offert' + (r.vouchers_created.length ? ' — carte pleine, bon créé' : '')); await openClient(CUR.customer.id); }
  catch (err) { toast(err.message, true); }
});
/* Scan du QR code de la carte avec la caméra (gratuit ; nécessite l'autorisation de la caméra) */
let scanStream = null, scanTimer = null, detector = null;
async function loadJsQR() { if (window.jsQR) return; await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
function stopScan() { clearInterval(scanTimer); if (scanStream) scanStream.getTracks().forEach(t => t.stop()); scanStream = null; $('scanBox').classList.add('hidden'); }
async function onCode(text) {
  const gq = String(text).match(/cheque\.html\?t=([a-f0-9]{20,})/i); if (gq) { stopScan(); location.href = '/cheques.html?t=' + gq[1]; return; }
  const m = String(text).match(/token=([a-f0-9]{20,})/i); if (!m) { toast("Ce QR code n'est pas une carte esprit mode.", true); return; }
  stopScan();
  try { const r = await api('/api/customers/by-token/' + m[1]); await openClient(r.id); } catch (err) { toast(err.message, true); }
}
$('scanBtn').addEventListener('click', async () => {
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('scanVideo'); v.srcObject = scanStream; await v.play(); $('scanBox').classList.remove('hidden');
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
    if (!detector) await loadJsQR();
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
    scanTimer = setInterval(async () => {
      if (!v.videoWidth) return;
      if (detector) { try { const r = await detector.detect(v); if (r[0]) onCode(r[0].rawValue); } catch (e) {} return; }
      cv.width = v.videoWidth; cv.height = v.videoHeight; ctx.drawImage(v, 0, 0);
      const img = ctx.getImageData(0, 0, cv.width, cv.height); const r = window.jsQR && window.jsQR(img.data, cv.width, cv.height);
      if (r && r.data) onCode(r.data);
    }, 350);
  } catch (e) { stopScan(); toast("Caméra indisponible : autorisez l'accès à la caméra, ou cherchez la cliente par son téléphone.", true); }
});
$('scanStop').addEventListener('click', stopScan);
async function buy(e) {
  e.preventDefault(); const b = $('buyBtn'); b.disabled = true; $('buyMsg').className = ''; $('buyMsg').textContent = '';
  try {
    const voucher_ids = [...document.querySelectorAll('[data-v]')].filter(x => x.checked).map(x => Number(x.dataset.v));
    const r = await api('/api/purchases', { method: 'POST', body: { customer_id: CUR.customer.id, amount: $('amount').value, excluded_amount: $('excl').value, voucher_ids, store: $('store').value } });
    $('clientCard').innerHTML = `<div class="done"><p class="muted">${esc(r.first_name)} ${esc(r.last_name)}</p><h2>Achat enregistré</h2>
      <div class="plus">+${r.added} points</div>${r.excluded ? `<p class="small muted">dont ${money(r.excluded)} soldés / en promotion, sans points</p>` : ''}<p>Nouveau solde : <b>${r.points} points</b></p>
      ${r.vouchers_used.length ? `<p class="ok">Bon de ${euros0(r.vouchers_used.reduce((n, v) => n + v.value, 0))} utilisé.</p>` : ''}
      ${r.vouchers_created.length ? `<p class="ok" style="font-size:18px"><b>Carte pleine !</b> Bon d'achat de ${euros0(r.vouchers_created.reduce((n, v) => n + v.value, 0))} créé, valable jusqu'au ${fdate(r.vouchers_created[0].expires_at)}.</p>` : ''}
      <button id="nextBtn">Nouvel achat</button></div>`;
    $('nextBtn').addEventListener('click', () => { $('clientCard').classList.add('hidden'); $('q').value = ''; $('results').innerHTML = ''; $('q').focus(); });
  } catch (err) { $('buyMsg').className = 'err'; $('buyMsg').textContent = err.message; b.disabled = false; }
}
async function paper() {
  $('paperBtn').disabled = true;
  try {
    const r = await api('/api/customers/' + CUR.customer.id + '/paper', { method: 'POST', body: { amount: $('paperAmt').value } });
    toast(r.vouchers_created.length ? 'Carte papier reprise : carte pleine, bon créé' : 'Carte papier reprise');
    await openClient(CUR.customer.id);
  } catch (e) { toast(e.message, true); $('paperBtn').disabled = false; }
}
$('newBtn').addEventListener('click', () => { $('newCard').classList.remove('hidden'); $('clientCard').classList.add('hidden'); if (/^[\d\s+]+$/.test($('q').value)) $('np').value = $('q').value; $('nf').focus(); });
$('cancelNew').addEventListener('click', () => $('newCard').classList.add('hidden'));
$('np').addEventListener('input', async () => {
  const d = $('np').value.replace(/\D/g, ''); $('dupWarn').innerHTML = '';
  if (d.length < 10) return;
  try { const l = await api('/api/customers?q=' + encodeURIComponent(d)); const ex = l.find(c => c.phone === d);
    if (ex) { $('dupWarn').innerHTML = `<p class="warn">Ce numéro appartient déjà à <b>${esc(ex.first_name)} ${esc(ex.last_name)}</b>. <button type="button" class="small" data-open2="${ex.id}">Ouvrir sa carte</button></p>`; } } catch (e) {}
});
$('dupWarn').addEventListener('click', e => { const b = e.target.closest('[data-open2]'); if (b) openClient(Number(b.dataset.open2)); });
$('newCard').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('createBtn'); b.disabled = true; $('msg').className = ''; $('msg').textContent = '';
  try {
    const c = await api('/api/customers', { method: 'POST', body: { first_name: $('nf').value, last_name: $('nl').value, phone: $('np').value, email: $('ne').value,
      birth_date: $('nb').value, terms_accepted: $('nt').checked, marketing_email: $('nme').checked, marketing_sms: $('nms').checked } });
    ['nf', 'nl', 'np', 'ne', 'nb'].forEach(i => $(i).value = ''); ['nt', 'nme', 'nms'].forEach(i => $(i).checked = false);
    toast('Carte créée'); await openClient(c.id, true);
  } catch (err) { $('msg').className = 'err'; $('msg').textContent = err.message; }
  b.disabled = false;
});
</script>
</body></html>
