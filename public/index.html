<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><title>Esprit Mode</title><style>body{font-family:system-ui;margin:0;background:#f7f5f2;color:#222}header{background:#171717;color:#fff;padding:22px}main{max-width:650px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:20px;margin:14px 0;box-shadow:0 3px 16px #0001}input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #ccc;margin:4px}button{background:#171717;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#777}.ok{padding:12px;background:#e9f7ee;border-radius:12px}</style></head><body><header><strong>ESPRIT MODE</strong><div>Fidélité</div></header><main><div class="card"><h2>Rejoindre Esprit Mode</h2><p>Créez gratuitement votre carte de fidélité.</p><div class="grid"><input id="fn" placeholder="Prénom"><input id="ln" placeholder="Nom"></div><input id="ph" placeholder="Téléphone"><input id="em" placeholder="E-mail"><div><label><input type="checkbox" id="me"> Je souhaite recevoir les offres par e-mail.</label></div><div><label><input type="checkbox" id="ms"> Je souhaite recevoir les offres par SMS.</label></div><button onclick="register()">Créer ma carte</button><div id="msg"></div></div><div class="card"><h2>Déjà cliente ?</h2><p>Utilisez le lien personnel reçu lors de votre inscription, ou demandez à la boutique de retrouver votre carte.</p><button onclick="login()">Espace boutique</button></div></main><script>async function register(){const body={first_name:fn.value,last_name:ln.value,phone:ph.value,email:em.value,marketing_email:me.checked,marketing_sms:ms.checked};const r=await fetch('/api/public/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();msg.innerHTML=r.ok?`<div class="ok">Carte créée ! <a href="/carte.html?token=${d.token}">Ouvrir ma carte</a></div>`:`<p>${d.error}</p>`}function login(){const u=prompt('Identifiant');const p=prompt('Mot de passe');if(u&&p){localStorage.auth='Basic '+btoa(u+':'+p);location.href='/admin.html'}}</script></body></html>
