<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icons/icon-192.png"><title>Esprit Mode</title><style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f5f2;color:#222}header{background:#171717;color:#fff;padding:22px;text-align:center;padding-top:calc(22px + env(safe-area-inset-top))}header strong{font-size:25px;letter-spacing:.08em}main{max-width:650px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:20px;margin:14px 0;box-shadow:0 3px 16px #0001}input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #ccc;margin:4px}button{background:#171717;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#777}.ok{padding:12px;background:#e9f7ee;border-radius:12px}.install{width:100%;font-weight:700}.ios{display:none;background:#f0ede9;padding:12px;border-radius:12px}</style></head><body><header><strong>ESPRIT MODE</strong><div>Carte de fidélité</div></header><main><div class="card"><h2>Rejoindre Esprit Mode</h2><p>Créez gratuitement votre carte de fidélité numérique.</p><div class="grid"><input id="fn" placeholder="Prénom"><input id="ln" placeholder="Nom"></div><input id="ph" placeholder="Téléphone"><input id="em" placeholder="E-mail"><div><label><input type="checkbox" id="me"> Je souhaite recevoir les offres par e-mail.</label></div><div><label><input type="checkbox" id="ms"> Je souhaite recevoir les offres par SMS.</label></div><button onclick="register()">Créer ma carte</button><div id="msg"></div></div><div class="card"><button id="install" class="install" style="display:none" onclick="installApp()">＋ Installer Esprit Mode</button><div id="ios" class="ios">Sur iPhone : Safari → Partager → Ajouter à l’écran d’accueil.</div></div><div class="card"><h3>Déjà cliente ?</h3><p class="muted">Utilisez votre lien personnel ou demandez à la boutique de retrouver votre carte.</p><button onclick="login()">Espace boutique</button></div></main><script>let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='block'});async function installApp(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.style.display='none'}}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});if(/iPhone|iPad|iPod/i.test(navigator.userAgent)&&!window.navigator.standalone)ios.style.display='block';async function register(){const body={first_name:fn.value,last_name:ln.value,phone:ph.value,email:em.value,marketing_email:me.checked,marketing_sms:ms.checked};const r=await fetch('/api/public/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();msg.innerHTML=r.ok?`<div class="ok">Carte créée ! <a href="/carte.html?token=${d.token}">Ouvrir ma carte</a></div>`:`<p>${d.error}</p>`}function login(){const u=prompt('Identifiant');const p=prompt('Mot de passe');if(u&&p){localStorage.auth='Basic '+btoa(u+':'+p);location.href='/admin.html'}}</script></body></html>
